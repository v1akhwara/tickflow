<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TickFlow</title>
<link rel="manifest" href="/manifest.json">
<style>
:root {
  --bg: #0f0f1a;
  --bg2: #1a1a2e;
  --bg3: #252540;
  --bg4: #2f2f4a;
  --text: #e8e8f0;
  --text2: #a0a0b8;
  --text3: #6a6a80;
  --accent: #6366f1;
  --accent2: #818cf8;
  --green: #22c55e;
  --yellow: #eab308;
  --red: #ef4444;
  --orange: #f97316;
  --blue: #3b82f6;
  --sidebar-w: 260px;
  --radius: 10px;
  --transition: 0.2s ease;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
button { cursor: pointer; border: none; background: none; color: var(--text); font-family: inherit; font-size: inherit; }
input, textarea, select { font-family: inherit; font-size: inherit; color: var(--text); background: var(--bg3); border: 1px solid var(--bg4); border-radius: 6px; padding: 8px 12px; outline: none; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 3px; }

/* ── Auth Screen ─────────────────────────────── */
#auth-screen { display:flex; align-items:center; justify-content:center; height:100dvh; background: linear-gradient(135deg, #0f0f1a 0%, #1a1a3e 100%); }
.auth-card { background:var(--bg2); padding:40px; border-radius:16px; width:360px; max-width:90vw; }
.auth-card h1 { font-size:28px; margin-bottom:6px; background: linear-gradient(135deg, var(--accent), #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.auth-card p { color:var(--text2); margin-bottom:24px; font-size:14px; }
.auth-card label { display:block; color:var(--text2); font-size:13px; margin-bottom:4px; margin-top:14px; }
.auth-card input { width:100%; padding:10px 14px; }
.auth-card .btn-primary { width:100%; margin-top:20px; padding:12px; background:var(--accent); border-radius:8px; font-weight:600; font-size:15px; transition:var(--transition); }
.auth-card .btn-primary:hover { background:var(--accent2); }
.auth-card .switch-link { display:block; text-align:center; margin-top:16px; color:var(--accent2); font-size:13px; cursor:pointer; }
.auth-card .error { color:var(--red); font-size:13px; margin-top:10px; }

/* ── App Layout ──────────────────────────────── */
#app { display:none; height:100dvh; }
.app-layout { display:flex; height:100%; }

/* ── Sidebar ─────────────────────────────────── */
.sidebar { width:var(--sidebar-w); background:var(--bg2); border-right:1px solid var(--bg3); display:flex; flex-direction:column; flex-shrink:0; transition:transform 0.3s ease; z-index:100; }
.sidebar-header { padding:20px 16px 12px; display:flex; align-items:center; justify-content:space-between; }
.sidebar-header h2 { font-size:20px; background:linear-gradient(135deg, var(--accent), #a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.sidebar-user { padding:0 16px 16px; display:flex; align-items:center; gap:10px; }
.sidebar-user .avatar { width:32px; height:32px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
.sidebar-user span { color:var(--text2); font-size:13px; }
.sidebar-nav { flex:1; overflow-y:auto; padding:0 8px; }
.nav-section { margin-bottom:16px; }
.nav-section-title { padding:4px 12px 6px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--text3); font-weight:600; }
.nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:8px; cursor:pointer; transition:var(--transition); font-size:14px; position:relative; }
.nav-item:hover { background:var(--bg3); }
.nav-item.active { background:var(--accent); color:#fff; }
.nav-item .icon { width:20px; text-align:center; font-size:16px; }
.nav-item .count { margin-left:auto; font-size:12px; color:var(--text3); background:var(--bg4); padding:1px 7px; border-radius:10px; }
.nav-item.active .count { background:rgba(255,255,255,0.2); color:#fff; }
.nav-item .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.sidebar-bottom { padding:12px 16px; border-top:1px solid var(--bg3); }
.add-list-btn { display:flex; align-items:center; gap:8px; padding:8px; color:var(--text2); font-size:13px; border-radius:6px; width:100%; }
.add-list-btn:hover { background:var(--bg3); color:var(--text); }

/* ── Main Content ────────────────────────────── */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.main-header { padding:16px 24px; display:flex; align-items:center; gap:16px; border-bottom:1px solid var(--bg3); flex-shrink:0; }
.main-header .menu-toggle { display:none; font-size:20px; padding:4px; }
.main-header h1 { font-size:22px; font-weight:700; flex:1; }
.main-header .view-toggle { display:flex; gap:4px; background:var(--bg3); padding:3px; border-radius:8px; }
.main-header .view-btn { padding:6px 14px; border-radius:6px; font-size:13px; color:var(--text2); transition:var(--transition); }
.main-header .view-btn.active { background:var(--accent); color:#fff; }
.main-header .view-btn:hover:not(.active) { color:var(--text); }
.search-bar { position:relative; }
.search-bar input { width:200px; padding:7px 12px 7px 32px; background:var(--bg3); border:1px solid transparent; border-radius:8px; font-size:13px; transition:var(--transition); }
.search-bar input:focus { width:280px; border-color:var(--accent); }
.search-bar .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--text3); font-size:14px; }

/* ── Task List View ──────────────────────────── */
.task-content { flex:1; overflow-y:auto; padding:16px 24px 100px; }
.task-group-header { font-size:13px; color:var(--text3); padding:16px 0 6px; text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }

/* ── Task Item ───────────────────────────────── */
.task-item { display:flex; align-items:flex-start; gap:12px; padding:12px 14px; border-radius:var(--radius); background:var(--bg2); margin-bottom:6px; transition:var(--transition); cursor:pointer; border:1px solid transparent; }
.task-item:hover { border-color:var(--bg4); background:var(--bg3); }
.task-item.completed .task-title { text-decoration:line-through; color:var(--text3); }
.task-checkbox { width:20px; height:20px; border-radius:50%; border:2px solid var(--text3); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:var(--transition); cursor:pointer; margin-top:2px; }
.task-checkbox:hover { border-color:var(--accent); }
.task-checkbox.checked { background:var(--green); border-color:var(--green); }
.task-checkbox.checked::after { content:"✓"; font-size:12px; color:#fff; font-weight:700; }
.task-checkbox.p-high { border-color:var(--red); }
.task-checkbox.p-med { border-color:var(--orange); }
.task-checkbox.p-low { border-color:var(--blue); }
.task-body { flex:1; min-width:0; }
.task-title { font-size:14px; line-height:1.4; word-break:break-word; }
.task-meta { display:flex; align-items:center; gap:8px; margin-top:4px; flex-wrap:wrap; }
.task-meta-item { font-size:11px; color:var(--text3); display:flex; align-items:center; gap:3px; }
.task-meta-item.overdue { color:var(--red); }
.task-meta-item.today { color:var(--accent2); }
.task-tag { font-size:10px; padding:1px 6px; border-radius:3px; color:#fff; }
.subtask-count { font-size:11px; color:var(--text3); }
.task-priority-flag { font-size:12px; }

/* ── Add Task ────────────────────────────────── */
.add-task-bar { position:fixed; bottom:0; left:var(--sidebar-w); right:0; padding:16px 24px; background:linear-gradient(transparent, var(--bg) 30%); z-index:50; }
.add-task-input { display:flex; align-items:center; gap:10px; background:var(--bg2); border:1px solid var(--bg4); border-radius:12px; padding:12px 16px; transition:var(--transition); }
.add-task-input:focus-within { border-color:var(--accent); }
.add-task-input input { flex:1; background:transparent; border:none; padding:0; font-size:14px; }
.add-task-input input:focus { border:none; }
.add-task-actions { display:flex; gap:4px; }
.add-task-actions button { padding:6px 8px; border-radius:6px; font-size:16px; color:var(--text3); transition:var(--transition); }
.add-task-actions button:hover { background:var(--bg4); color:var(--text); }
.add-task-actions button.active { color:var(--accent); }

/* ── Task Detail Panel ───────────────────────── */
.detail-panel { width:380px; background:var(--bg2); border-left:1px solid var(--bg3); display:none; flex-direction:column; overflow-y:auto; flex-shrink:0; }
.detail-panel.open { display:flex; }
.detail-header { padding:16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bg3); }
.detail-header .close-btn { font-size:20px; padding:4px 8px; border-radius:6px; color:var(--text2); }
.detail-header .close-btn:hover { background:var(--bg3); }
.detail-header .delete-btn { font-size:13px; color:var(--red); padding:4px 10px; border-radius:6px; }
.detail-header .delete-btn:hover { background:rgba(239,68,68,0.15); }
.detail-body { padding:16px; display:flex; flex-direction:column; gap:16px; }
.detail-field label { display:block; font-size:12px; color:var(--text3); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
.detail-field input, .detail-field textarea, .detail-field select { width:100%; }
.detail-field textarea { min-height:80px; resize:vertical; }
.priority-picker { display:flex; gap:6px; }
.priority-btn { padding:6px 14px; border-radius:6px; font-size:12px; border:1px solid var(--bg4); transition:var(--transition); }
.priority-btn:hover { border-color:var(--text3); }
.priority-btn.active { color:#fff; }
.priority-btn.p-none.active { background:var(--bg4); }
.priority-btn.p-low.active { background:var(--blue); border-color:var(--blue); }
.priority-btn.p-med.active { background:var(--orange); border-color:var(--orange); }
.priority-btn.p-high.active { background:var(--red); border-color:var(--red); }
.subtasks-section { margin-top:8px; }
.subtask-item { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:13px; }
.subtask-item .task-checkbox { width:16px; height:16px; }
.add-subtask-input { display:flex; gap:6px; margin-top:6px; }
.add-subtask-input input { flex:1; padding:6px 10px; font-size:13px; }
.add-subtask-input button { padding:6px 12px; background:var(--accent); border-radius:6px; font-size:12px; font-weight:600; }
.tag-chips { display:flex; flex-wrap:wrap; gap:4px; margin-top:4px; }
.tag-chip { font-size:11px; padding:3px 8px; border-radius:4px; color:#fff; display:flex; align-items:center; gap:4px; }
.tag-chip .remove { cursor:pointer; opacity:0.7; }
.tag-chip .remove:hover { opacity:1; }

/* ── Calendar View ───────────────────────────── */
.calendar-view { padding:20px 24px; overflow-y:auto; flex:1; }
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
.cal-header h2 { font-size:20px; }
.cal-nav { display:flex; gap:8px; }
.cal-nav button { padding:6px 12px; background:var(--bg3); border-radius:6px; font-size:14px; }
.cal-nav button:hover { background:var(--bg4); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-day-header { text-align:center; font-size:12px; color:var(--text3); padding:8px; font-weight:600; }
.cal-day { min-height:100px; background:var(--bg2); border-radius:6px; padding:6px; cursor:pointer; transition:var(--transition); border:1px solid transparent; }
.cal-day:hover { border-color:var(--bg4); }
.cal-day.other-month { opacity:0.3; }
.cal-day.today { border-color:var(--accent); }
.cal-day .day-num { font-size:13px; font-weight:600; margin-bottom:4px; }
.cal-day.today .day-num { color:var(--accent); }
.cal-task { font-size:11px; padding:2px 5px; border-radius:3px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
.cal-task.completed { text-decoration:line-through; opacity:0.5; }
.cal-day .more { font-size:10px; color:var(--text3); }

/* ── Modals ──────────────────────────────────── */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:200; }
.modal-overlay.open { display:flex; }
.modal { background:var(--bg2); border-radius:12px; padding:24px; width:400px; max-width:90vw; }
.modal h3 { margin-bottom:16px; }
.modal .form-row { margin-bottom:12px; }
.modal .form-row label { display:block; font-size:12px; color:var(--text3); margin-bottom:4px; }
.modal .form-row input { width:100%; }
.modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:20px; }
.modal .btn-cancel { padding:8px 16px; background:var(--bg3); border-radius:6px; }
.modal .btn-save { padding:8px 16px; background:var(--accent); border-radius:6px; font-weight:600; }

/* ── Mobile ──────────────────────────────────── */
@media (max-width: 768px) {
  .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); }
  .sidebar.open { transform:translateX(0); }
  .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:99; display:none; }
  .sidebar-overlay.open { display:block; }
  .main-header .menu-toggle { display:block; }
  .add-task-bar { left:0; }
  .detail-panel { position:fixed; right:0; top:0; bottom:0; z-index:150; width:100%; max-width:400px; }
  .search-bar input { width:140px; }
  .search-bar input:focus { width:180px; }
  .cal-day { min-height:60px; }
  .cal-task { font-size:10px; }
}
</style>
</head>
<body>

<!-- Auth Screen -->
<div id="auth-screen">
  <div class="auth-card">
    <h1>TickFlow</h1>
    <p>Your tasks, everywhere.</p>
    <div id="auth-form">
      <label>Username</label>
      <input type="text" id="auth-user" autocomplete="username" placeholder="Enter username">
      <label>Password</label>
      <input type="password" id="auth-pass" autocomplete="current-password" placeholder="Enter password">
      <div id="auth-error" class="error"></div>
      <button class="btn-primary" id="auth-submit" onclick="doAuth()">Log In</button>
      <span class="switch-link" id="auth-switch" onclick="toggleAuthMode()">Don't have an account? Register</span>
    </div>
  </div>
</div>

<!-- App -->
<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>TickFlow</h2>
        <button onclick="logout()" style="font-size:13px;color:var(--text3)" title="Log out">&#x2398;</button>
      </div>
      <div class="sidebar-user">
        <div class="avatar" id="user-avatar">V</div>
        <span id="user-name">vik</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Smart Lists</div>
          <div class="nav-item active" data-view="all" onclick="setView('all',this)">
            <span class="icon">&#x2605;</span> All Tasks <span class="count" id="count-all">0</span>
          </div>
          <div class="nav-item" data-view="today" onclick="setView('today',this)">
            <span class="icon">&#x263C;</span> Today <span class="count" id="count-today">0</span>
          </div>
          <div class="nav-item" data-view="upcoming" onclick="setView('upcoming',this)">
            <span class="icon">&#x2192;</span> Upcoming <span class="count" id="count-upcoming">0</span>
          </div>
          <div class="nav-item" data-view="overdue" onclick="setView('overdue',this)">
            <span class="icon">&#x26A0;</span> Overdue <span class="count" id="count-overdue">0</span>
          </div>
          <div class="nav-item" data-view="completed" onclick="setView('completed',this)">
            <span class="icon">&#x2714;</span> Completed <span class="count" id="count-done">0</span>
          </div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Lists</div>
          <div id="lists-nav"></div>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Tags</div>
          <div id="tags-nav"></div>
        </div>
      </nav>
      <div class="sidebar-bottom">
        <button class="add-list-btn" onclick="showModal('list')">+ Add List</button>
        <button class="add-list-btn" onclick="showModal('tag')">+ Add Tag</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main">
      <div class="main-header">
        <button class="menu-toggle" onclick="toggleSidebar()">&#9776;</button>
        <h1 id="view-title">All Tasks</h1>
        <div class="search-bar">
          <span class="search-icon">&#x1F50D;</span>
          <input type="text" id="search-input" placeholder="Search tasks..." oninput="debouncedSearch()">
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="btn-list-view" onclick="switchMainView('list')">List</button>
          <button class="view-btn" id="btn-cal-view" onclick="switchMainView('calendar')">Calendar</button>
        </div>
      </div>

      <!-- List View -->
      <div class="task-content" id="task-list-view">
        <div id="tasks-container"></div>
      </div>

      <!-- Calendar View -->
      <div class="calendar-view" id="calendar-view" style="display:none">
        <div class="cal-header">
          <button class="cal-nav" onclick="calPrev()">&#x25C0;</button>
          <h2 id="cal-title">May 2026</h2>
          <button class="cal-nav" onclick="calNext()">&#x25B6;</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
      </div>

      <!-- Add Task Bar -->
      <div class="add-task-bar" id="add-task-bar">
        <div class="add-task-input">
          <span style="color:var(--accent);font-size:18px">+</span>
          <input type="text" id="new-task-input" placeholder="Add a task..." onkeydown="if(event.key==='Enter')addQuickTask()">
          <div class="add-task-actions">
            <button id="btn-quick-date" onclick="toggleQuickDate()" title="Set due date">&#x1F4C5;</button>
            <button id="btn-quick-priority" onclick="cycleQuickPriority()" title="Set priority">&#x2691;</button>
            <button onclick="addQuickTask()" title="Add" style="color:var(--accent);font-weight:700">&#x2713;</button>
          </div>
        </div>
        <div id="quick-date-picker" style="display:none;margin-top:8px;display:none;gap:6px;flex-wrap:wrap">
          <button class="priority-btn" onclick="setQuickDate('today')">Today</button>
          <button class="priority-btn" onclick="setQuickDate('tomorrow')">Tomorrow</button>
          <button class="priority-btn" onclick="setQuickDate('nextweek')">Next Week</button>
          <input type="date" id="quick-date-input" onchange="quickDateVal=this.value" style="font-size:12px;padding:4px 8px">
        </div>
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel" id="detail-panel">
      <div class="detail-header">
        <button class="close-btn" onclick="closeDetail()">&#x2715;</button>
        <button class="delete-btn" onclick="deleteCurrentTask()">Delete</button>
      </div>
      <div class="detail-body">
        <div class="detail-field">
          <label>Title</label>
          <input type="text" id="detail-title" onchange="updateTask('title',this.value)">
        </div>
        <div class="detail-field">
          <label>Description</label>
          <textarea id="detail-desc" onchange="updateTask('description',this.value)" placeholder="Add notes..."></textarea>
        </div>
        <div class="detail-field">
          <label>List</label>
          <select id="detail-list" onchange="updateTask('list_id',this.value||null)"></select>
        </div>
        <div class="detail-field">
          <label>Priority</label>
          <div class="priority-picker">
            <button class="priority-btn p-none" onclick="setPriority(0)">None</button>
            <button class="priority-btn p-low" onclick="setPriority(1)">Low</button>
            <button class="priority-btn p-med" onclick="setPriority(2)">Med</button>
            <button class="priority-btn p-high" onclick="setPriority(3)">High</button>
          </div>
        </div>
        <div class="detail-field">
          <label>Due Date</label>
          <input type="date" id="detail-due" onchange="updateTask('due_date',this.value||null)">
        </div>
        <div class="detail-field">
          <label>Due Time</label>
          <input type="time" id="detail-time" onchange="updateTask('due_time',this.value||null)">
        </div>
        <div class="detail-field">
          <label>Recurring</label>
          <select id="detail-recurring" onchange="updateTask('recurring',this.value||null)">
            <option value="">None</option>
            <option value="daily">Daily</option>
            <option value="weekdays">Weekdays</option>
            <option value="weekly">Weekly</option>
            <option value="biweekly">Biweekly</option>
            <option value="monthly">Monthly</option>
            <option value="yearly">Yearly</option>
          </select>
        </div>
        <div class="detail-field">
          <label>Tags</label>
          <div class="tag-chips" id="detail-tags"></div>
          <select id="detail-tag-add" onchange="addTagToTask(this.value);this.value=''" style="margin-top:6px">
            <option value="">+ Add tag</option>
          </select>
        </div>
        <div class="subtasks-section">
          <label style="font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:0.5px">Subtasks</label>
          <div id="detail-subtasks"></div>
          <div class="add-subtask-input">
            <input type="text" id="new-subtask-input" placeholder="Add subtask..." onkeydown="if(event.key==='Enter')addSubtask()">
            <button onclick="addSubtask()">Add</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-content"></div>
</div>

<script>
// ── State ───────────────────────────────────────────────────────
let token = localStorage.getItem('tf_token');
let username = localStorage.getItem('tf_user');
let authMode = 'login';
let tasks = [], lists = [], tags = [];
let currentView = 'all';
let currentListId = null;
let currentTagId = null;
let currentTask = null;
let mainView = 'list';
let calYear, calMonth;
let quickPriority = 0;
let quickDateVal = '';
let searchTimeout;

const API = '';
const today = () => new Date().toISOString().split('T')[0];

// ── Init ────────────────────────────────────────────────────────
if (token) {
  showApp();
} else {
  document.getElementById('auth-screen').style.display = 'flex';
}

// ── Auth ────────────────────────────────────────────────────────
function toggleAuthMode() {
  authMode = authMode === 'login' ? 'register' : 'login';
  document.getElementById('auth-submit').textContent = authMode === 'login' ? 'Log In' : 'Register';
  document.getElementById('auth-switch').textContent = authMode === 'login'
    ? "Don't have an account? Register"
    : "Already have an account? Log In";
  document.getElementById('auth-error').textContent = '';
}

async function doAuth() {
  const user = document.getElementById('auth-user').value.trim();
  const pass = document.getElementById('auth-pass').value;
  if (!user || !pass) return;
  try {
    const r = await fetch(`${API}/api/${authMode === 'login' ? 'login' : 'register'}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    token = data.token;
    username = data.username;
    localStorage.setItem('tf_token', token);
    localStorage.setItem('tf_user', username);
    showApp();
  } catch (e) {
    document.getElementById('auth-error').textContent = e.message;
  }
}

function logout() {
  token = null; username = null;
  localStorage.removeItem('tf_token');
  localStorage.removeItem('tf_user');
  document.getElementById('app').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'flex';
}

async function showApp() {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('user-avatar').textContent = (username || 'U')[0].toUpperCase();
  document.getElementById('user-name').textContent = username;
  const now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  await loadAll();
}

// ── API Helpers ─────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...opts.headers }
  });
  if (r.status === 401) { logout(); throw new Error('Session expired'); }
  return r.json();
}

async function loadAll() {
  [lists, tags] = await Promise.all([api('/api/lists'), api('/api/tags')]);
  await loadTasks();
  renderSidebar();
  renderDetailSelects();
}

async function loadTasks() {
  const params = new URLSearchParams();
  const search = document.getElementById('search-input')?.value;
  if (search) params.set('search', search);

  if (currentView === 'today') params.set('due_date', today());
  else if (currentView === 'completed') params.set('completed', '1');
  else if (currentView === 'overdue') {
    params.set('due_start', '2000-01-01');
    params.set('due_end', addDays(today(), -1));
    params.set('completed', '0');
  } else if (currentView === 'upcoming') {
    params.set('due_start', today());
    params.set('due_end', addDays(today(), 30));
    params.set('completed', '0');
  } else if (currentView === 'list' && currentListId) {
    params.set('list_id', currentListId);
  } else if (currentView === 'tag' && currentTagId) {
    params.set('tag_id', currentTagId);
  }

  if (currentView !== 'completed') params.set('completed', params.get('completed') || '0');

  tasks = await api(`/api/tasks?${params}`);
  renderTasks();
  renderCalendar();
  updateCounts();
}

// ── Render Sidebar ──────────────────────────────────────────────
function renderSidebar() {
  const listsNav = document.getElementById('lists-nav');
  listsNav.innerHTML = lists.map(l => `
    <div class="nav-item ${currentView==='list'&&currentListId==l.id?'active':''}"
      data-view="list" data-id="${l.id}" onclick="setListView(${l.id},this)">
      <span class="dot" style="background:${l.color}"></span>
      ${esc(l.name)}
      <span class="count" id="count-list-${l.id}">0</span>
    </div>
  `).join('');

  const tagsNav = document.getElementById('tags-nav');
  tagsNav.innerHTML = tags.map(t => `
    <div class="nav-item ${currentView==='tag'&&currentTagId==t.id?'active':''}"
      data-view="tag" data-id="${t.id}" onclick="setTagView(${t.id},this)">
      <span class="dot" style="background:${t.color}"></span>
      ${esc(t.name)}
    </div>
  `).join('');
}

// ── Render Tasks ────────────────────────────────────────────────
function renderTasks() {
  const container = document.getElementById('tasks-container');
  const parentTasks = tasks.filter(t => !t.parent_id);

  if (!parentTasks.length) {
    container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:12px">&#x2713;</div>
      <div style="font-size:16px">No tasks here</div>
      <div style="font-size:13px;margin-top:4px">Add one below to get started</div>
    </div>`;
    return;
  }

  container.innerHTML = parentTasks.map(t => renderTaskItem(t)).join('');
}

function renderTaskItem(t) {
  const subtasks = tasks.filter(s => s.parent_id === t.id);
  const doneSubtasks = subtasks.filter(s => s.completed).length;
  const listObj = lists.find(l => l.id === t.list_id);
  const taskTags = t.tag_ids.map(id => tags.find(tg => tg.id === id)).filter(Boolean);
  const pClass = t.priority === 3 ? 'p-high' : t.priority === 2 ? 'p-med' : t.priority === 1 ? 'p-low' : '';
  const isOverdue = t.due_date && t.due_date < today() && !t.completed;
  const isToday = t.due_date === today();
  const priorityFlag = t.priority === 3 ? '&#x1F534;' : t.priority === 2 ? '&#x1F7E0;' : t.priority === 1 ? '&#x1F535;' : '';

  return `<div class="task-item ${t.completed?'completed':''}" onclick="openDetail(${t.id})" data-id="${t.id}">
    <div class="task-checkbox ${t.completed?'checked':''} ${pClass}" onclick="event.stopPropagation();toggleComplete(${t.id},${!t.completed})"></div>
    <div class="task-body">
      <div class="task-title">${esc(t.title)} ${priorityFlag?'<span class="task-priority-flag">'+priorityFlag+'</span>':''}</div>
      <div class="task-meta">
        ${t.due_date ? `<span class="task-meta-item ${isOverdue?'overdue':''} ${isToday?'today':''}">&#x1F4C5; ${formatDate(t.due_date)}${t.due_time?' '+t.due_time:''}</span>` : ''}
        ${t.recurring ? `<span class="task-meta-item">&#x1F501; ${t.recurring}</span>` : ''}
        ${listObj ? `<span class="task-meta-item"><span class="dot" style="background:${listObj.color};width:6px;height:6px;border-radius:50%;display:inline-block"></span> ${esc(listObj.name)}</span>` : ''}
        ${subtasks.length ? `<span class="subtask-count">${doneSubtasks}/${subtasks.length} subtasks</span>` : ''}
        ${taskTags.map(tg => `<span class="task-tag" style="background:${tg.color}">${esc(tg.name)}</span>`).join('')}
      </div>
    </div>
  </div>`;
}

// ── Task Actions ────────────────────────────────────────────────
async function toggleComplete(id, completed) {
  await api(`/api/tasks/${id}`, { method: 'PUT', body: JSON.stringify({ completed }) });
  await loadTasks();
  if (currentTask && currentTask.id === id) {
    currentTask = tasks.find(t => t.id === id) || currentTask;
  }
}

async function addQuickTask() {
  const input = document.getElementById('new-task-input');
  const title = input.value.trim();
  if (!title) return;

  const body = { title, priority: quickPriority };
  if (quickDateVal) body.due_date = quickDateVal;
  if (currentView === 'list' && currentListId) body.list_id = currentListId;
  else if (lists.length) body.list_id = lists[0].id;

  await api('/api/tasks', { method: 'POST', body: JSON.stringify(body) });
  input.value = '';
  quickPriority = 0;
  quickDateVal = '';
  document.getElementById('btn-quick-priority').style.color = 'var(--text3)';
  document.getElementById('btn-quick-date').classList.remove('active');
  document.getElementById('quick-date-picker').style.display = 'none';
  await loadTasks();
}

async function updateTask(field, value) {
  if (!currentTask) return;
  await api(`/api/tasks/${currentTask.id}`, { method: 'PUT', body: JSON.stringify({ [field]: value }) });
  await loadTasks();
  currentTask = tasks.find(t => t.id === currentTask.id) || currentTask;
}

async function deleteCurrentTask() {
  if (!currentTask) return;
  if (!confirm('Delete this task?')) return;
  await api(`/api/tasks/${currentTask.id}`, { method: 'DELETE' });
  closeDetail();
  await loadTasks();
}

async function addSubtask() {
  const input = document.getElementById('new-subtask-input');
  const title = input.value.trim();
  if (!title || !currentTask) return;
  await api('/api/tasks', { method: 'POST', body: JSON.stringify({
    title, parent_id: currentTask.id, list_id: currentTask.list_id
  })});
  input.value = '';
  await loadTasks();
  renderSubtasks();
}

async function addTagToTask(tagId) {
  if (!tagId || !currentTask) return;
  const newTags = [...new Set([...currentTask.tag_ids, Number(tagId)])];
  await api(`/api/tasks/${currentTask.id}`, { method: 'PUT', body: JSON.stringify({ tag_ids: newTags }) });
  await loadTasks();
  currentTask = tasks.find(t => t.id === currentTask.id);
  renderDetailTags();
}

async function removeTagFromTask(tagId) {
  if (!currentTask) return;
  const newTags = currentTask.tag_ids.filter(id => id !== tagId);
  await api(`/api/tasks/${currentTask.id}`, { method: 'PUT', body: JSON.stringify({ tag_ids: newTags }) });
  await loadTasks();
  currentTask = tasks.find(t => t.id === currentTask.id);
  renderDetailTags();
}

// ── Detail Panel ────────────────────────────────────────────────
function openDetail(id) {
  currentTask = tasks.find(t => t.id === id);
  if (!currentTask) return;
  const panel = document.getElementById('detail-panel');
  panel.classList.add('open');

  document.getElementById('detail-title').value = currentTask.title;
  document.getElementById('detail-desc').value = currentTask.description || '';
  document.getElementById('detail-list').value = currentTask.list_id || '';
  document.getElementById('detail-due').value = currentTask.due_date || '';
  document.getElementById('detail-time').value = currentTask.due_time || '';
  document.getElementById('detail-recurring').value = currentTask.recurring || '';

  document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
  const pMap = { 0: 'p-none', 1: 'p-low', 2: 'p-med', 3: 'p-high' };
  document.querySelector(`.priority-picker .${pMap[currentTask.priority]}`).classList.add('active');

  renderDetailTags();
  renderSubtasks();
}

function closeDetail() {
  document.getElementById('detail-panel').classList.remove('open');
  currentTask = null;
}

function setPriority(p) {
  document.querySelectorAll('.priority-btn').forEach(b => b.classList.remove('active'));
  const pMap = { 0: 'p-none', 1: 'p-low', 2: 'p-med', 3: 'p-high' };
  document.querySelector(`.priority-picker .${pMap[p]}`).classList.add('active');
  updateTask('priority', p);
}

function renderDetailTags() {
  if (!currentTask) return;
  const container = document.getElementById('detail-tags');
  const taskTags = currentTask.tag_ids.map(id => tags.find(t => t.id === id)).filter(Boolean);
  container.innerHTML = taskTags.map(t =>
    `<span class="tag-chip" style="background:${t.color}">${esc(t.name)}
      <span class="remove" onclick="removeTagFromTask(${t.id})">&#x2715;</span>
    </span>`
  ).join('');

  const select = document.getElementById('detail-tag-add');
  const available = tags.filter(t => !currentTask.tag_ids.includes(t.id));
  select.innerHTML = '<option value="">+ Add tag</option>' +
    available.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('');
}

function renderSubtasks() {
  if (!currentTask) return;
  const subtasks = tasks.filter(t => t.parent_id === currentTask.id);
  const container = document.getElementById('detail-subtasks');
  container.innerHTML = subtasks.map(s => `
    <div class="subtask-item">
      <div class="task-checkbox ${s.completed?'checked':''}" style="width:16px;height:16px"
        onclick="toggleComplete(${s.id},${!s.completed})"></div>
      <span style="${s.completed?'text-decoration:line-through;color:var(--text3)':''}">${esc(s.title)}</span>
    </div>
  `).join('');
}

function renderDetailSelects() {
  const sel = document.getElementById('detail-list');
  sel.innerHTML = '<option value="">No list</option>' +
    lists.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join('');
}

// ── Calendar View ───────────────────────────────────────────────
function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  document.getElementById('cal-title').textContent =
    new Date(calYear, calMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const todayStr = today();

  // Previous month
  for (let i = firstDay - 1; i >= 0; i--) {
    const d = daysInPrev - i;
    const dateStr = formatDateISO(calYear, calMonth - 1, d);
    html += renderCalDay(d, dateStr, true);
  }
  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = formatDateISO(calYear, calMonth, d);
    html += renderCalDay(d, dateStr, false, dateStr === todayStr);
  }
  // Next month
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    const dateStr = formatDateISO(calYear, calMonth + 1, d);
    html += renderCalDay(d, dateStr, true);
  }

  grid.innerHTML = html;
}

function renderCalDay(dayNum, dateStr, otherMonth, isToday = false) {
  const dayTasks = tasks.filter(t => t.due_date === dateStr && !t.parent_id);
  const show = dayTasks.slice(0, 3);
  const more = dayTasks.length - 3;
  const listColorMap = {};
  lists.forEach(l => listColorMap[l.id] = l.color);

  return `<div class="cal-day ${otherMonth?'other-month':''} ${isToday?'today':''}" onclick="calDayClick('${dateStr}')">
    <div class="day-num">${dayNum}</div>
    ${show.map(t => `<div class="cal-task ${t.completed?'completed':''}"
      style="background:${listColorMap[t.list_id]||'var(--bg4)'}"
      onclick="event.stopPropagation();openDetail(${t.id})">${esc(t.title)}</div>`).join('')}
    ${more > 0 ? `<div class="more">+${more} more</div>` : ''}
  </div>`;
}

function calPrev() { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calDayClick(dateStr) {
  quickDateVal = dateStr;
  document.getElementById('new-task-input').focus();
  document.getElementById('btn-quick-date').classList.add('active');
}

// ── Navigation ──────────────────────────────────────────────────
function setView(view, el) {
  currentView = view;
  currentListId = null;
  currentTagId = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const titles = { all:'All Tasks', today:'Today', upcoming:'Upcoming', overdue:'Overdue', completed:'Completed' };
  document.getElementById('view-title').textContent = titles[view] || 'Tasks';
  closeDetail();
  loadTasks();
  if (window.innerWidth < 768) toggleSidebar();
}

function setListView(id, el) {
  currentView = 'list'; currentListId = id; currentTagId = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const list = lists.find(l => l.id === id);
  document.getElementById('view-title').textContent = list ? list.name : 'List';
  closeDetail();
  loadTasks();
  if (window.innerWidth < 768) toggleSidebar();
}

function setTagView(id, el) {
  currentView = 'tag'; currentTagId = id; currentListId = null;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  const tag = tags.find(t => t.id === id);
  document.getElementById('view-title').textContent = tag ? `#${tag.name}` : 'Tag';
  closeDetail();
  loadTasks();
  if (window.innerWidth < 768) toggleSidebar();
}

function switchMainView(view) {
  mainView = view;
  document.getElementById('btn-list-view').classList.toggle('active', view === 'list');
  document.getElementById('btn-cal-view').classList.toggle('active', view === 'calendar');
  document.getElementById('task-list-view').style.display = view === 'list' ? 'block' : 'none';
  document.getElementById('calendar-view').style.display = view === 'calendar' ? 'block' : 'none';
  document.getElementById('add-task-bar').style.display = view === 'list' ? 'block' : 'none';
  if (view === 'calendar') { loadAllTasksForCal(); renderCalendar(); }
}

async function loadAllTasksForCal() {
  // For calendar, load all incomplete tasks + recently completed
  tasks = await api('/api/tasks');
  const completedTasks = await api('/api/tasks?completed=1');
  tasks = [...tasks, ...completedTasks];
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}

// ── Quick Add Helpers ───────────────────────────────────────────
function toggleQuickDate() {
  const el = document.getElementById('quick-date-picker');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
  document.getElementById('btn-quick-date').classList.toggle('active');
}
function setQuickDate(preset) {
  const d = new Date();
  if (preset === 'tomorrow') d.setDate(d.getDate() + 1);
  else if (preset === 'nextweek') { d.setDate(d.getDate() + (8 - d.getDay()) % 7); if (d.toISOString().split('T')[0] === today()) d.setDate(d.getDate()+7); }
  quickDateVal = d.toISOString().split('T')[0];
  document.getElementById('quick-date-input').value = quickDateVal;
  document.getElementById('quick-date-picker').style.display = 'none';
}
function cycleQuickPriority() {
  quickPriority = (quickPriority + 1) % 4;
  const colors = ['var(--text3)', 'var(--blue)', 'var(--orange)', 'var(--red)'];
  document.getElementById('btn-quick-priority').style.color = colors[quickPriority];
}

// ── Modals ──────────────────────────────────────────────────────
function showModal(type) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');
  overlay.classList.add('open');

  if (type === 'list') {
    content.innerHTML = `
      <h3>New List</h3>
      <div class="form-row"><label>Name</label><input type="text" id="modal-name" placeholder="List name"></div>
      <div class="form-row"><label>Color</label><input type="color" id="modal-color" value="#4A90D9"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="createList()">Create</button>
      </div>`;
  } else if (type === 'tag') {
    content.innerHTML = `
      <h3>New Tag</h3>
      <div class="form-row"><label>Name</label><input type="text" id="modal-name" placeholder="Tag name"></div>
      <div class="form-row"><label>Color</label><input type="color" id="modal-color" value="#888888"></div>
      <div class="btn-row">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="createTag()">Create</button>
      </div>`;
  }

  setTimeout(() => document.getElementById('modal-name')?.focus(), 100);
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

async function createList() {
  const name = document.getElementById('modal-name').value.trim();
  const color = document.getElementById('modal-color').value;
  if (!name) return;
  await api('/api/lists', { method: 'POST', body: JSON.stringify({ name, color }) });
  closeModal();
  await loadAll();
}

async function createTag() {
  const name = document.getElementById('modal-name').value.trim();
  const color = document.getElementById('modal-color').value;
  if (!name) return;
  await api('/api/tags', { method: 'POST', body: JSON.stringify({ name, color }) });
  closeModal();
  await loadAll();
}

// ── Counts ──────────────────────────────────────────────────────
async function updateCounts() {
  try {
    const stats = await api('/api/stats');
    document.getElementById('count-all').textContent = stats.total - stats.completed;
    document.getElementById('count-today').textContent = stats.dueToday;
    document.getElementById('count-overdue').textContent = stats.overdue;
    document.getElementById('count-done').textContent = stats.completed;
    document.getElementById('count-upcoming').textContent = '';

    // List counts
    for (const l of lists) {
      const el = document.getElementById(`count-list-${l.id}`);
      if (el) {
        const listTasks = await api(`/api/tasks?list_id=${l.id}&completed=0`);
        el.textContent = listTasks.length;
      }
    }
  } catch(e) {}
}

// ── Search ──────────────────────────────────────────────────────
function debouncedSearch() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => loadTasks(), 300);
}

// ── Utilities ───────────────────────────────────────────────────
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const t = today();
  if (dateStr === t) return 'Today';
  if (dateStr === addDays(t, 1)) return 'Tomorrow';
  if (dateStr === addDays(t, -1)) return 'Yesterday';
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function formatDateISO(y, m, d) {
  const dt = new Date(y, m, d);
  return dt.toISOString().split('T')[0];
}

// ── Keyboard Shortcuts ──────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeDetail(); closeModal(); }
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    e.preventDefault();
    document.getElementById('new-task-input').focus();
  }
});

// Modal close on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
